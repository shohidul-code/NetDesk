# Weekly update PRs for every dependency source (PROPOSAL §10.2 "Vulnerable dependencies").
# The 7-day cooldown matches uv's exclude-newer and npm's min-release-age.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
