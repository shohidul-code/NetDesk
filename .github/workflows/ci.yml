# CI (PROPOSAL §12.8): backend, frontend, security (dependencies and secrets), docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: netdesk
          POSTGRES_PASSWORD: netdesk
          POSTGRES_DB: netdesk
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U netdesk -d netdesk"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://netdesk:netdesk@localhost:5433/netdesk
      # CI-only value; not used anywhere else.
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      # Actions pinned by commit SHA (tag in the comment) so a moved tag cannot change CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q --cov --cov-report=term

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      - name: pip-audit (Python dependencies, from uv.lock)
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit@2.10.1 --strict --progress-spinner off -r /tmp/requirements.txt
      - name: npm audit (frontend, fails on high or critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: gitleaks (secrets in git history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --exit-code 1 --gitleaks-ignore-path .gitleaksignore

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env from the example
        run: |
          cp .env.example .env
          # CI-only demo password for the seed script; not used anywhere else.
          sed -i 's/^SEED_DEMO_PASSWORD=.*/SEED_DEMO_PASSWORD=ci-demo-password-123/' .env
          grep -q '^SEED_DEMO_PASSWORD=ci-demo-password-123$' .env
      # --wait blocks until every service is healthy; fail if that takes over 5 minutes.
      - name: Start the stack from a fresh clone
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Seed demo data
        run: docker compose exec -T api python -m scripts.seed
      - name: Smoke test
        env:
          SMOKE_EMAIL: admin@netdesk.demo
          SMOKE_PASSWORD: ci-demo-password-123
        run: scripts/smoke.sh http://localhost:8000
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
      # The production int8 embedder (embedder/): build it, run it under Render's memory
      # limit, and check it answers like TEI (384-dim, unit-length vectors).
      - name: Build and check the int8 embedder
        run: |
          docker build -t netdesk-embedder embedder
          docker run -d --name embedder --memory 450m -p 8082:8000 netdesk-embedder
          for i in $(seq 1 60); do curl -fsS http://localhost:8082/health && break; sleep 1; done
          curl -fsS -o /tmp/embed.json -H 'Content-Type: application/json' \
            -d '{"inputs": ["query: রাউটার কিভাবে রিস্টার্ট করব?"]}' http://localhost:8082/embed
          python3 -c '
          import json, math
          v = json.load(open("/tmp/embed.json"))[0]
          assert len(v) == 384, len(v)
          assert abs(math.sqrt(sum(x * x for x in v)) - 1) < 1e-3
          print("embedder ok: 384 dims, unit length")'
          docker stats --no-stream embedder
          docker rm -f embedder
      # With a key set (as on Render): wrong or non-ASCII keys get 401 (never a 500), and an
      # oversized body gets 413 before it is read into memory.
      - name: Check the embedder's key and size limits
        run: |
          docker run -d --name embedder-keyed --memory 450m -e EMBEDDER_API_KEY=ci-key -p 8083:8000 netdesk-embedder
          for i in $(seq 1 60); do curl -fsS http://localhost:8083/health && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' "$@" http://localhost:8083/embed; }
          [ "$(code -d '{"inputs":["q"]}')" = 401 ]
          [ "$(code -H 'Authorization: Bearer wrong' -d '{"inputs":["q"]}')" = 401 ]
          [ "$(code -H $'Authorization: Bearer caf\xe9' -d '{"inputs":["q"]}')" = 401 ]
          [ "$(code -H 'Authorization: Bearer ci-key' -d '{"inputs":["q"]}')" = 200 ]
          head -c 1000000 /dev/zero | tr '\0' a > /tmp/big.txt
          [ "$(code -H 'Authorization: Bearer ci-key' --data-binary @/tmp/big.txt)" = 413 ]
          echo "embedder key and size checks ok"
