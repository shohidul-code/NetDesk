# Local stack (PROPOSAL §12.1): db, embeddings, api.
#   cp .env.example .env      # then set JWT_SECRET_KEY
#   docker compose up -d --build
#   open http://localhost:8000/docs
# The credentials below are for this local database only.

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: netdesk
      POSTGRES_PASSWORD: netdesk
      POSTGRES_DB: netdesk
    # Host port 5433, so it does not clash with a local PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netdesk -d netdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    # Host port 8080 lets the Phase 5 ingest script reach it from your machine.
    ports:
      - "8080:80"
    volumes:
      - model-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      # The first start downloads the model; allow a few minutes.
      retries: 30
      start_period: 30s

  api:
    build: .
    env_file: .env
    environment:
      # Inside Compose, services reach each other by name, not localhost.
      DATABASE_URL: postgresql+asyncpg://netdesk:netdesk@db:5432/netdesk
      EMBEDDINGS_URL: http://embeddings:80
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  model-cache:
